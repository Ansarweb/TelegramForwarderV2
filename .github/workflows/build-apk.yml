name: Build Telegram Forwarder V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      -       - name: Diagnose project
        run: |
          echo "===== ROOT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 6 -type f | sort

          echo "===== GRADLE FILES ====="
          find . -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) | sort

          echo "===== APP DIRECTORY ====="
          if [ -d app ]; then
            echo "app directory EXISTS"
            find app -maxdepth 6 -type f | sort
          else
            echo "ERROR: app directory DOES NOT EXIST"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramForwarder-V2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
